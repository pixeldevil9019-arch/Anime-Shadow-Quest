name: Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (test build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Configure UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Unity authentication secrets are present."

      # Unity installs and invokes its supported embedded Gradle/Android toolchain.
      - name: Build APK with Unity and Gradle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          unityVersion: 6000.0.32f1
          buildsPath: build
          buildName: AnimeShadowQuest
          buildMethod: AnimeShadowQuestBuild.PerformBuild
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Verify APK output
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/Android/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::Unity finished without producing build/Android/*.apk."
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          ls -lh "${apks[@]}"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShadowQuest-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 30
